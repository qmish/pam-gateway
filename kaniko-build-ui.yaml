apiVersion: batch/v1
kind: Job
metadata:
  name: build-ui
  namespace: pam-gateway
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: worker-node-1
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: clone
          image: alpine/git:latest
          command: ["sh", "-c", "git clone https://x-access-token:$GIT_TOKEN@github.com/qmish/pam-gateway.git /workspace"]
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-credentials
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        - name: build-ui
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--context=/workspace"
            - "--dockerfile=/workspace/src/PamGateway.Ui/Dockerfile"
            - "--destination=ghcr.io/qmish/pam-gateway-ui:latest"
            - "--cache=false"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
      containers:
        - name: done
          image: busybox:latest
          command: ["echo", "UI image built and pushed successfully"]
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: ghcr-secret
            items:
              - key: .dockerconfigjson
                path: config.json
