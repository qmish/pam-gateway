apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: pam-gateway
type: Opaque
stringData:
  POSTGRES_USER: pam
  POSTGRES_PASSWORD: pam
  POSTGRES_DB: pam_gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pam-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-auth
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pam-gateway
spec:
  selector:
    app: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432
