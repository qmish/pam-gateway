name: CI — Сборка, тесты, Docker образы

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pam-gateway

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Сборка
        run: dotnet build --no-restore

      - name: Проверка стиля кода
        run: dotnet format --verify-no-changes --no-restore || true

      - name: SAST — Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/csharp
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_RULES: p/csharp p/owasp-top-ten p/secrets
        continue-on-error: true

      - name: SAST — SecurityCodeScan
        run: |
          dotnet tool install --global security-scan || true
          security-scan PamGateway.sln --export=sast-report.sarif || true

      - name: Публикация SAST отчёта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.sarif
          if-no-files-found: ignore

      - name: Запуск тестов с покрытием
        run: >
          dotnet test --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Установка ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Генерация отчёта покрытия
        run: >
          reportgenerator
          -reports:./TestResults/**/coverage.cobertura.xml
          -targetdir:./TestResults/CoverageReport
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura;TextSummary"

      - name: Проверка минимального покрытия (70%)
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[\d.]+' ./TestResults/CoverageReport/Summary.txt || echo "0")
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" = "1" ]; then
            echo "::warning::Покрытие ${COVERAGE}% ниже порога 70%"
          fi

      - name: Публикация отчёта покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

      - name: Вывод сводки покрытия
        if: always()
        run: cat ./TestResults/CoverageReport/Summary.txt || true

  docker:
    name: Сборка Docker-образов
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: src/PamGateway.Api/Dockerfile
            image: api
          - context: .
            dockerfile: src/PamGateway.Worker/Dockerfile
            image: worker
          - context: .
            dockerfile: src/PamGateway.Agent/Dockerfile
            image: agent
          - context: .
            dockerfile: src/PamGateway.Ui/Dockerfile
            image: ui
    steps:
      - uses: actions/checkout@v4

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и пуш
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}

      - name: Сканирование образа (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
