namespace: pam-gateway

api:
  image: pam-gateway-api:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  auth:
    enabled: true
    authority: "http://keycloak:8080/realms/pam"
    audience: "account"
    roleMapping:
      enableKeycloakMapping: true
      realmAccessClaim: "realm_access"
      resourceAccessClaim: "resource_access"
      resourceClientId: "pam-gateway"
  storage:
    provider: "Postgres"
    connectionString: "Host=postgres;Port=5432;Database=pam_gateway;Username=pam;Password=pam"
  jira:
    baseUrl: "https://it-insight.dengisrazy.ru/"
    projectKey: "SD"
    issueType: "Запрос на обслуживание"
    authType: "Basic"
    username: "mkuryatnikov"
    token: "<CHANGE_ME>"
    webhookSecret: ""
    statusMap:
      "To Do": "pending"
      "In Progress": "pending"
      "Approved": "approved"
      "Rejected": "denied"
      "Done": "expired"
    transitionPending: ""
    transitionApproved: ""
    transitionDenied: ""
    transitionExpired: ""
  cmdb:
    provider: "Insight"
    baseUrl: "https://it-insight.dengisrazy.ru"
    iql: "System"
    authType: "Basic"
    username: "mkuryatnikov"
    token: "<CHANGE_ME>"
    typeAttribute: "Тип"
    environmentAttribute: "Среда"
    criticalityAttribute: "Критичность"
    statusAttribute: "Статус"
    defaultType: "Unknown"
    defaultEnvironment: "prod"
    defaultCriticality: "non-critical"
    defaultStatus: "Используется"
  targets:
    - Id: "SCH-249443"
      Name: "Терминальная ферма"
      Host: "rdp.local"
      Port: 3389
      Labels:
        os: "windows"
        access: "rdp"
      Type: "Remote Desktop"
      Environment: "prod"
      Criticality: "critical"
      Status: "Используется"
    - Id: "SCH-229958"
      Name: "Active Directory"
      Host: "ad.local"
      Port: 389
      Labels:
        os: "windows"
        role: "ad"
      Type: "Active Directory"
      Environment: "prod"
      Criticality: "non-critical"
      Status: "Используется"
  access:
    roleLabelRules:
      System_Admin_Windows:
        os: "windows"
      System_Admin_Linux:
        os: "linux"
    roleLabelExpressions:
      Security_Auditor: "env=prod && criticality=critical"
    rolePolicyIds:
      System_Admin_Windows:
        - "POL-RDP-REMOTE"
      System_Admin_Linux:
        - "POL-SSH-SERVER"
  recording:
    defaultMode: "node"
    allowedModes:
      - "node"
      - "node-sync"
      - "proxy"
      - "proxy-sync"
  recordingStorage:
    provider: "Local"
    localPath: "/data/recordings"
    s3:
      endpoint: ""
      bucket: "pam-recordings"
      accessKey: ""
      secretKey: ""
      region: "us-east-1"
      useSsl: true
      forcePathStyle: true
  observability:
    enabled: false
    otlpEndpoint: ""

ui:
  image: pam-gateway-ui:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  apiBaseUrl: "http://pam-gateway-api"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

worker:
  image: pam-gateway-worker:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  storage:
    provider: "Postgres"
    connectionString: "Host=postgres;Port=5432;Database=pam_gateway;Username=pam;Password=pam"
  jira:
    baseUrl: "https://it-insight.dengisrazy.ru/"
    projectKey: "SD"
    issueType: "Запрос на обслуживание"
    authType: "Basic"
    username: "mkuryatnikov"
    token: "<CHANGE_ME>"
    transitionPending: ""
    transitionApproved: ""
    transitionDenied: ""
    transitionExpired: ""
  observability:
    enabled: false
    otlpEndpoint: ""

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:latest
  adminUser: admin
  adminPassword: admin
  hostname: "keycloak"
  hostnameStrict: false
  hostnamePort: "8080"

postgres:
  enabled: true
  image: postgres:16
  user: pam
  password: pam
  database: pam_gateway

ingress:
  enabled: false
  className: "nginx"
  host: "pam.local"

otelCollector:
  enabled: false
  image: "otel/opentelemetry-collector:0.110.0"
  service:
    type: ClusterIP
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
