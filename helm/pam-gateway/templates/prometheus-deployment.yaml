{{- if .Values.observabilityStack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.observabilityStack.prometheus.image }}
          ports:
            - containerPort: {{ .Values.observabilityStack.prometheus.service.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.observabilityStack.prometheus.probes.readinessPath }}
              port: {{ .Values.observabilityStack.prometheus.service.port }}
            initialDelaySeconds: {{ .Values.observabilityStack.prometheus.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.observabilityStack.prometheus.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.observabilityStack.prometheus.probes.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.observabilityStack.prometheus.probes.livenessPath }}
              port: {{ .Values.observabilityStack.prometheus.service.port }}
            initialDelaySeconds: {{ .Values.observabilityStack.prometheus.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.observabilityStack.prometheus.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.observabilityStack.prometheus.probes.timeoutSeconds }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
{{- end }}
