{{- if .Values.observabilityStack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observabilityStack.grafana.image }}
          ports:
            - containerPort: {{ .Values.observabilityStack.grafana.service.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "{{ .Values.observabilityStack.grafana.adminUser }}"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "{{ .Values.observabilityStack.grafana.adminPassword }}"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
{{- end }}
