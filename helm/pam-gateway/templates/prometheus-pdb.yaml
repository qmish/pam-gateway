{{- if and .Values.observabilityStack.enabled .Values.observabilityStack.prometheus.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-pdb
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ .Values.observabilityStack.prometheus.pdb.minAvailable }}
  selector:
    matchLabels:
      app: prometheus
{{- end }}
