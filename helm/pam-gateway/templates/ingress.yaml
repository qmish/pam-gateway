{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pam-gateway
  namespace: {{ .Values.namespace }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pam-gateway-api
                port:
                  number: 80
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: pam-gateway-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pam-gateway-ui
                port:
                  number: 80
{{- end }}
