apiVersion: apps/v1
kind: Deployment
metadata:
  name: pam-gateway-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: pam-gateway-worker
  template:
    metadata:
      labels:
        app: pam-gateway-worker
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: pam-gateway-worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.imagePullPolicy | default "IfNotPresent" }}
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/worker-healthy"]
            initialDelaySeconds: {{ .Values.worker.probes.initialDelaySeconds }}
            periodSeconds: 5
            failureThreshold: {{ .Values.worker.probes.startupFailureThreshold | default 24 }}
            timeoutSeconds: {{ .Values.worker.probes.timeoutSeconds }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/worker-healthy && find /tmp/worker-healthy -mmin -3 | grep -q ."]
            periodSeconds: {{ .Values.worker.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.timeoutSeconds }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/worker-healthy && find /tmp/worker-healthy -mmin -5 | grep -q ."]
            periodSeconds: 30
            timeoutSeconds: {{ .Values.worker.probes.timeoutSeconds }}
          env:
            - name: Storage__Provider
              value: "{{ .Values.worker.storage.provider }}"
            - name: ConnectionStrings__PamGateway
              value: "{{ .Values.worker.storage.connectionString }}"
            - name: Jira__BaseUrl
              value: "{{ .Values.worker.jira.baseUrl }}"
            - name: Jira__ProjectKey
              value: "{{ .Values.worker.jira.projectKey }}"
            - name: Jira__IssueType
              value: "{{ .Values.worker.jira.issueType }}"
            - name: Jira__AuthType
              value: "{{ .Values.worker.jira.authType }}"
            - name: Jira__Username
              value: "{{ .Values.worker.jira.username }}"
            - name: Jira__TransitionPending
              value: "{{ .Values.worker.jira.transitionPending }}"
            - name: Jira__TransitionApproved
              value: "{{ .Values.worker.jira.transitionApproved }}"
            - name: Jira__TransitionDenied
              value: "{{ .Values.worker.jira.transitionDenied }}"
            - name: Jira__TransitionExpired
              value: "{{ .Values.worker.jira.transitionExpired }}"
            - name: Observability__Enabled
              value: "{{ .Values.worker.observability.enabled }}"
            - name: Observability__OtlpEndpoint
              value: "{{ .Values.worker.observability.otlpEndpoint }}"
            - name: Jira__Token
              valueFrom:
                secretKeyRef:
                  name: pam-gateway-api-secrets
                  key: jiraToken
