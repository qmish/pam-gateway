apiVersion: v1
kind: ConfigMap
metadata:
  name: pam-gateway-api-config
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Storage": {
        "Provider": "{{ .Values.api.storage.provider }}"
      },
      "Auth": {
        "Enabled": {{ .Values.api.auth.enabled }},
        "Authority": "{{ .Values.api.auth.authority }}",
        "Audience": "{{ .Values.api.auth.audience }}",
        "RoleMapping": {
          "EnableKeycloakMapping": {{ .Values.api.auth.roleMapping.enableKeycloakMapping }},
          "RealmAccessClaim": "{{ .Values.api.auth.roleMapping.realmAccessClaim }}",
          "ResourceAccessClaim": "{{ .Values.api.auth.roleMapping.resourceAccessClaim }}",
          "ResourceClientId": "{{ .Values.api.auth.roleMapping.resourceClientId }}"
        }
      },
      "Jira": {
        "BaseUrl": "{{ .Values.api.jira.baseUrl }}",
        "ProjectKey": "{{ .Values.api.jira.projectKey }}",
        "IssueType": "{{ .Values.api.jira.issueType }}",
        "AuthType": "{{ .Values.api.jira.authType }}",
        "Username": "{{ .Values.api.jira.username }}",
        "Token": "",
        "WebhookSecret": "{{ .Values.api.jira.webhookSecret }}",
        "StatusMap": {{ toJson .Values.api.jira.statusMap }},
        "TransitionPending": "{{ .Values.api.jira.transitionPending }}",
        "TransitionApproved": "{{ .Values.api.jira.transitionApproved }}",
        "TransitionDenied": "{{ .Values.api.jira.transitionDenied }}",
        "TransitionExpired": "{{ .Values.api.jira.transitionExpired }}"
      },
      "Cmdb": {
        "Provider": "{{ .Values.api.cmdb.provider }}",
        "BaseUrl": "{{ .Values.api.cmdb.baseUrl }}",
        "Iql": "{{ .Values.api.cmdb.iql }}",
        "AuthType": "{{ .Values.api.cmdb.authType }}",
        "Username": "{{ .Values.api.cmdb.username }}",
        "Token": "",
        "TypeAttribute": "{{ .Values.api.cmdb.typeAttribute }}",
        "EnvironmentAttribute": "{{ .Values.api.cmdb.environmentAttribute }}",
        "CriticalityAttribute": "{{ .Values.api.cmdb.criticalityAttribute }}",
        "StatusAttribute": "{{ .Values.api.cmdb.statusAttribute }}",
        "DefaultType": "{{ .Values.api.cmdb.defaultType }}",
        "DefaultEnvironment": "{{ .Values.api.cmdb.defaultEnvironment }}",
        "DefaultCriticality": "{{ .Values.api.cmdb.defaultCriticality }}",
        "DefaultStatus": "{{ .Values.api.cmdb.defaultStatus }}"
      },
      "ConnectionStrings": {
        "PamGateway": "{{ .Values.api.storage.connectionString }}"
      },
      "Targets": {{ toJson .Values.api.targets }}
      ,
      "Access": {
        "RoleLabelRules": {{ toJson .Values.api.access.roleLabelRules }},
        "RoleLabelExpressions": {{ toJson .Values.api.access.roleLabelExpressions }},
        "RolePolicyIds": {{ toJson .Values.api.access.rolePolicyIds }}
      },
      "Recording": {
        "DefaultMode": "{{ .Values.api.recording.defaultMode }}",
        "AllowedModes": {{ toJson .Values.api.recording.allowedModes }}
      },
      "RecordingStorage": {
        "Provider": "{{ .Values.api.recordingStorage.provider }}",
        "LocalPath": "{{ .Values.api.recordingStorage.localPath }}",
        "S3": {
          "Endpoint": "{{ .Values.api.recordingStorage.s3.endpoint }}",
          "Bucket": "{{ .Values.api.recordingStorage.s3.bucket }}",
          "AccessKey": "{{ .Values.api.recordingStorage.s3.accessKey }}",
          "SecretKey": "{{ .Values.api.recordingStorage.s3.secretKey }}",
          "Region": "{{ .Values.api.recordingStorage.s3.region }}",
          "UseSsl": {{ .Values.api.recordingStorage.s3.useSsl }},
          "ForcePathStyle": {{ .Values.api.recordingStorage.s3.forcePathStyle }}
        }
      },
      "Observability": {
        "Enabled": {{ .Values.api.observability.enabled }},
        "OtlpEndpoint": "{{ .Values.api.observability.otlpEndpoint }}"
      }
    }
