{{- if and .Values.observabilityStack.enabled .Values.observabilityStack.grafana.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ .Values.observabilityStack.grafana.pdb.minAvailable }}
  selector:
    matchLabels:
      app: grafana
{{- end }}
